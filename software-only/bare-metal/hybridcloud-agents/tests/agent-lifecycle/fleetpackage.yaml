# Optional self-pruning FleetPackage for end-to-end agent lifecycle and
# removal verification.
# Create it during verification with:
#   gcloud container fleet packages create hybridcloud-agents-agent-lifecycle \
#     --source=tests/agent-lifecycle/fleetpackage.yaml --location=us-central1
# Update it to the pruned release with:
#   gcloud container fleet packages update hybridcloud-agents-agent-lifecycle \
#     --source=tests/agent-lifecycle/fleetpackage.yaml --location=us-central1
# Delete it after verification completes:
#   gcloud container fleet packages delete hybridcloud-agents-agent-lifecycle \
#     --location=us-central1
deletionPropagationPolicy: FOREGROUND
labels:
  configdelivery-skip-bmctl-clusters: "true"
resourceBundleSelector:
  cloudBuildRepository:
    name: projects/YOUR_PROJECT_ID/locations/us-central1/connections/YOUR_CONNECTION/repositories/YOUR_REPOSITORY
    path: software-only/bare-metal/hybridcloud-agents/tests/agent-lifecycle/environments
    serviceAccount: projects/YOUR_PROJECT_ID/serviceAccounts/YOUR_PUBLISHER_SA_NAME@YOUR_PROJECT_ID.iam.gserviceaccount.com
    tag: v0.5.1-e2e.1
rolloutStrategy:
  rolling:
    maxConcurrent: 1
target:
  fleet:
    project: projects/YOUR_PROJECT_ID
    selector:
      matchLabels:
        cluster-role: agents
variantSelector:
  variantNameTemplate: "${membership.labels['cluster-role']}"
