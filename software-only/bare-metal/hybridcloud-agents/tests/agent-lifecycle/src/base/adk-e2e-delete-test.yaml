# Throwaway agent workload for end-to-end GitOps registration, per-agent Envoy
# SDS consumer key sync, and automated removal verification.
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: adk-e2e-delete-test
    app.kubernetes.io/name: adk-e2e-delete-test
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: adk-e2e-delete-test
  namespace: agent-workloads
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: allow-adk-e2e-delete-test
  namespace: agent-workloads
spec:
  egress:
    - ports:
        - port: 15001
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: e2e-delete-test-egress-proxy
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent-ingress-proxy
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              managed-by: stackdriver
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: adk-e2e-delete-test
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a2a-protocol.org/agent-card: '{"endpoint":"/.well-known/agent-card.json","port":8080,"protocol":"HTTP"}'
  labels:
    app.kubernetes.io/component: adk-e2e-delete-test
    app.kubernetes.io/name: adk-e2e-delete-test
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
    registry.gke.io/functional-type: AGENT
  name: adk-e2e-delete-test
  namespace: agent-workloads
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: adk-e2e-delete-test
      app.kubernetes.io/name: adk-e2e-delete-test
  template:
    metadata:
      labels:
        app.kubernetes.io/component: adk-e2e-delete-test
        app.kubernetes.io/name: adk-e2e-delete-test
        app.kubernetes.io/part-of: hybrid-cloud-agents-tests
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS
              value: "false"
            - name: ADK_CLIENT_MODE
              value: apigee_openai
            - name: EGRESS_PROXY_BASE
              value: http://e2e-delete-test-egress-envoy.agent-workloads.svc.cluster.local:15001
            - name: KSA_TOKEN_PATH
              value: /var/run/secrets/tokens/apigee-ksa/token
            - name: MODEL_ALIAS
              value: enterprise-sovereign
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-collector.otel-system.svc.cluster.local:4318/v1/traces
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "false"
            - name: SOVEREIGN_MODEL_NAME
              value: google/gemma-4-31B-it
          image: registry.hybrid-agents.internal/hybrid-cloud-agents/adk-sovereign-agent:0.2.0@sha256:f4ee7fb21b7cc11bb62ad79b287ca259dfc444c427551291facd65e5f134e162
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          name: adk-agent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/run/secrets/tokens/apigee-ksa
              name: apigee-ksa
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: adk-e2e-delete-test
      volumes:
        - name: apigee-ksa
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: api.hybrid-agents.internal
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            medium: Memory
            sizeLimit: 64Mi
          name: tmp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: adk-e2e-delete-test
    app.kubernetes.io/name: adk-e2e-delete-test
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: adk-e2e-delete-test
  namespace: agent-workloads
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/component: adk-e2e-delete-test
    app.kubernetes.io/name: adk-e2e-delete-test
  type: ClusterIP
